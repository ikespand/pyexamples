plugins { id 'com.android.application' }

android {
    namespace 'com.example.mrz'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.mrz'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../.tools/docsaid-models'] } }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']; merges += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'org.opencv:opencv:4.9.0'
    implementation 'org.jmrtd:jmrtd:0.8.9'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.27'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.named('preBuild').configure {
    doFirst {
        def pinned = [
            'align.onnx': '950070fd4a46e25d46db7c35d0ed77612d9063f70d4543c7c504f0da6a943a89',
            'spot.onnx': 'd58b6af5501295fb1c9d93a529b6725d98d4983711f2d2b3323855d155ec2105',
            'det.onnx': '0786844728d828dc68c19b844aa87e2b29fdba3a587468f2863824d116ffc269',
            'rec.onnx': '07cef987fc1852aac12f18e1269fbaf1e2644579ca5743061d6f9cec7bef77c0'
        ]
        pinned.each { name, expected ->
            def model = file("../../.tools/docsaid-models/${name}")
            if (!model.isFile()) throw new GradleException("Pinned scan model missing. Run: .venv/bin/python scripts/download_models.py")
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
            if (digest != expected) throw new GradleException("Pinned scan model checksum mismatch: ${name}")
        }
    }
}
